<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoe Store</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f4f6f9;
}

header {
    background: #111;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 20px;
    padding: 20px;
}

.product {
    background: white;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.product img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
}

button {
    background: #111;
    color: white;
    padding: 8px 12px;
    border: none;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: orange;
}

.cart-box {
    background: white;
    padding: 20px;
    margin: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.qty-btn {
    padding: 3px 8px;
    margin: 0 5px;
}
</style>
</head>

<body>

<header>
    <h2>👟 Shoe Store</h2>
    <div>Cart: <span id="cart-count">0</span></div>
</header>

<div class="container">

    <div class="product">
        <img src="images/pexels-styves-exantus-7162424-6412694.jpg" alt="">
        <h3>Nike Air</h3>
        <p>$50</p>
        <button onclick="addToCart('Nike Air',50)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="images/pexels-marcio-carvalho-1334537412-28879459.jpg" alt="">
        <h3>Adidas Runner</h3>
        <p>$45</p>
        <button onclick="addToCart('Adidas Runner',45)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="images/pexels-victor-filemon-lopez-sanchez-3289921-15036819.jpg" alt="">
        <h3>Puma Classic</h3>
        <p>$40</p>
        <button onclick="addToCart('Puma Classic',40)">Add to Cart</button>
    </div>

</div>

<div class="cart-box">
    <h3>🛒 Cart</h3>
    <div id="cart-items"></div>
    <h4>Total: $<span id="total">0</span></h4>
    <div style="margin: 10px 0;">
        <input id="user-name" type="text" placeholder="Your Name" readonly style="padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 5px; background: #f0f0f0;">
    </div>
    <button onclick="clearCart()">Clear Cart</button>
    <button onclick="submitOrder()" style="background: green;">Submit Order</button>
</div>

<script>
let cart = [];

(function() {
    const params = new URLSearchParams(window.location.search);
    const fullname = params.get('fullname');
    const email = params.get('email');
    if(fullname && email) {
        localStorage.setItem('user_fullname', fullname);
        localStorage.setItem('user_email', email);
        window.history.replaceState({}, document.title, '/shop');
    }
    const savedName = localStorage.getItem('user_fullname');
    if(savedName) {
        document.getElementById('user-name').value = savedName;
    }
})();

function addToCart(name, price) {
    let item = cart.find(p => p.name === name);

    if(item){
        item.quantity++;
    } else {
        cart.push({name, price, quantity:1});
    }

    updateCart();
}

function changeQty(name, amount){
    let item = cart.find(p => p.name === name);
    if(!item) return;

    item.quantity += amount;

    if(item.quantity <= 0){
        cart = cart.filter(p => p.name !== name);
    }

    updateCart();
}

function clearCart(){
    cart = [];
    updateCart();
}

function submitOrder(){
    if(cart.length === 0){
        alert('Cart is empty');
        return;
    }

    const user_name = document.getElementById('user-name').value.trim();
    if(!user_name){
        alert('Please enter your name');
        return;
    }

    fetch('/submit-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_name, items: cart })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if(data.success){
            clearCart();
        }
    })
    .catch(() => alert('Order failed'));
}

function updateCart(){
    let cartItems = document.getElementById("cart-items");
    let total = 0;
    let count = 0;

    cartItems.innerHTML = "";

    cart.forEach(item => {
        total += item.price * item.quantity;
        count += item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">
                <div>
                    ${item.name} 
                    <button class="qty-btn" onclick="changeQty('${item.name}', -1)">-</button>
                    ${item.quantity}
                    <button class="qty-btn" onclick="changeQty('${item.name}', 1)">+</button>
                </div>
                <div>
                    $${item.price * item.quantity}
                </div>
            </div>
        `;
    });

    document.getElementById("total").innerText = total;
    document.getElementById("cart-count").innerText = count;
}
</script>

</body>
</html>
