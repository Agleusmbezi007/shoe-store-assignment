<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Authentication System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: "Segoe UI", sans-serif;
}

/* MAIN CARD */
.auth-card{
    width:100%;
    max-width:520px;
    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    background:white;
}

/* HEADER */
.auth-header{
    background: linear-gradient(135deg,#4f46e5,#6d28d9);
    color:white;
    text-align:center;
    padding:25px;
}

.auth-header h3{
    margin:0;
    font-weight:600;
}

/* FORM AREA */
.form-area{
    padding:30px;
}

/* INPUT STYLE */
.form-control{
    border-radius:12px;
    padding:12px 14px;
    border:1px solid #ddd;
    transition:0.2s;
}

.form-control:focus{
    border-color:#6d28d9;
    box-shadow: 0 0 0 0.2rem rgba(109,40,217,0.15);
}

/* BUTTONS */
.btn-primary, .btn-success{
    border-radius:12px;
    padding:12px;
    font-weight:600;
}

/* TAB STYLE */
.nav-tabs{
    border:none;
    margin-top:-10px;
}

.nav-tabs .nav-link{
    width:50%;
    text-align:center;
    border:none;
    color:#555;
    font-weight:600;
    padding:12px;
}

.nav-tabs .nav-link.active{
    background:#6d28d9;
    color:white;
    border-radius:10px;
}

/* INPUT GROUP ICON STYLE */
.input-group-text{
    background:#f3f4f6;
    border-radius:12px 0 0 12px;
    border:1px solid #ddd;
}

/* PASSWORD TOGGLE */
.toggle{
    font-size:13px;
    color:#6d28d9;
    cursor:pointer;
    text-align:right;
    display:block;
    margin-top:5px;
}

</style>

</head>

<body>

<div class="auth-card">

<!-- HEADER -->
<div class="auth-header">
<h3>User Account System</h3>
<p class="mb-0">Login or create a new account</p>
</div>

<!-- TABS -->
<ul class="nav nav-tabs">
  <li class="nav-item w-50">
    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login">Login</button>
  </li>
  <li class="nav-item w-50">
    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">Register</button>
  </li>
</ul>

<!-- CONTENT -->
<div class="tab-content form-area">

<!-- LOGIN -->
<div class="tab-pane fade show active" id="login">

<form action="/login" method="POST" autocomplete="new-password">

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" name="l1" data-name="email" placeholder="Enter your email" readonly onfocus="this.removeAttribute('readonly')" required>
</div>

<div class="mb-2">
<label class="form-label">Password</label>
<input type="text" id="loginPass" class="form-control" name="l2" data-name="password" placeholder="Enter password" readonly onfocus="this.removeAttribute('readonly')" data-pass="1" required>
</div>

<span class="toggle" onclick="toggle('loginPass')">Show / Hide Password</span>

<button class="btn btn-dark w-100 mt-3">Login</button>

</form>

</div>

<!-- REGISTER -->
<div class="tab-pane fade" id="register">

<form action="/register" method="POST" autocomplete="new-password">

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" name="r1" data-name="fullname" placeholder="Your full name" readonly onfocus="this.removeAttribute('readonly')" required>
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="tel" class="form-control" name="r2" data-name="phone" placeholder="e.g 07XXXXXXXX" readonly onfocus="this.removeAttribute('readonly')" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" name="r3" data-name="email" placeholder="Enter email" readonly onfocus="this.removeAttribute('readonly')" required>
</div>

<div class="mb-2">
<label class="form-label">Password</label>
<input type="text" id="regPass" class="form-control" name="r4" data-name="password" placeholder="Create password" readonly onfocus="this.removeAttribute('readonly')" data-pass="1" required>
</div>

<span class="toggle" onclick="toggle('regPass')">Show / Hide Password</span>

<button class="btn btn-success w-100 mt-3">Create Account</button>

</form>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function toggle(id){
    var input = document.getElementById(id);
    input.type = input.type === "text" ? "password" : "text";
}

function muteField(el){
    el.setAttribute('readonly','');
    el.addEventListener('focus',function h(){
        this.removeAttribute('readonly');
        if(this.dataset.pass) this.type = 'password';
        this.removeEventListener('focus',h);
    },{once:true});
}

function freezeForm(tab){
    tab.querySelectorAll('input').forEach(muteField);
}

document.querySelectorAll('[data-bs-toggle="tab"]').forEach(function(btn){
    btn.addEventListener('shown.bs.tab', function(e){
        var pane = document.querySelector(e.target.dataset.bsTarget);
        if(pane) freezeForm(pane);
    });
});

document.querySelectorAll('form').forEach(function(f){
    f.addEventListener('submit',function(){
        this.querySelectorAll('[data-name]').forEach(function(el){
            el.name = el.dataset.name;
        });
    });
});

freezeForm(document.getElementById('login'));
freezeForm(document.getElementById('register'));
</script>

</body>
</html>
