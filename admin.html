<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial; background: #f4f6f9; margin: 0; padding: 20px; }
h1 { margin: 0 0 20px; }
h2 { margin: 30px 0 15px; }
.back { display: inline-block; margin-bottom: 15px; color: #555; text-decoration: none; }
table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #111; color: white; }
.pending { color: orange; font-weight: bold; }
.confirmed { color: green; font-weight: bold; }
.confirm-btn { background: green; color: white; border: none; padding: 6px 14px; border-radius: 5px; cursor: pointer; }
.confirm-btn:hover { opacity: 0.8; }
.delete-btn { background: red; color: white; border: none; padding: 6px 14px; border-radius: 5px; cursor: pointer; }
.delete-btn:hover { opacity: 0.8; }
.unsold-btn { background: #f0ad4e; color: white; border: none; padding: 6px 14px; border-radius: 5px; cursor: pointer; }
.unsold-btn:hover { opacity: 0.8; }
.sold-badge { background: red; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
.card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; max-width: 500px; }
.card input, .card select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
.card button { background: #111; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
.card button:hover { background: orange; }
img.thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
</style>
</head>
<body>
<a href="/shop" class="back">← Back to Shop</a>
<h1>🛠️ Admin Dashboard</h1>

<!-- ADD PRODUCT -->
<h2>➕ Add New Product</h2>
<div class="card">
    <input id="prod-name" type="text" placeholder="Product Name" required>
    <input id="prod-price" type="number" step="0.01" placeholder="Price (e.g. 45)" required>
    <input id="prod-image" type="text" placeholder="Image path (e.g. images/abc.jpg)" required>
    <button onclick="addProduct()">Add Product</button>
    <div id="add-status" style="margin-top:8px;font-size:14px;"></div>
</div>

<!-- PRODUCTS TABLE -->
<h2>📦 Products</h2>
<table>
<thead><tr><th>ID</th><th>Image</th><th>Name</th><th>Price</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="products-body"><tr><td colspan="6" style="text-align:center;">Loading...</td></tr></tbody>
</table>

<!-- PAYMENTS -->
<h2>📋 Pending Payments</h2>
<table>
<thead><tr><th>Date</th><th>Customer</th><th>Email</th><th>Amount</th><th>Items</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="payments-body"><tr><td colspan="7" style="text-align:center;">Loading...</td></tr></tbody>
</table>

<script>
function loadProducts() {
    fetch('/api/products').then(r => r.json()).then(data => {
        const tbody = document.getElementById('products-body');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No products</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(p => `
            <tr>
                <td>${p.id}</td>
                <td><img class="thumb" src="${p.image}" alt=""></td>
                <td>${p.name}</td>
                <td>$${p.price}</td>
                <td>${p.sold ? '<span class="sold-badge">SOLD</span>' : '<span style="color:green;">Available</span>'}</td>
                <td>
                    ${p.sold ? `<button class="unsold-btn" onclick="unsoldProduct(${p.id})">Mark Available</button>` : ''}
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
                </td>
            </tr>
        `).join('');
    });
}

function addProduct() {
    var name = document.getElementById('prod-name').value.trim();
    var price = document.getElementById('prod-price').value.trim();
    var image = document.getElementById('prod-image').value.trim();
    var status = document.getElementById('add-status');
    if (!name || !price || !image) {
        status.innerHTML = '<span style="color:red;">All fields required</span>';
        return;
    }
    status.innerHTML = 'Adding...';
    fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, image })
    }).then(r => r.json()).then(data => {
        if (data.success) {
            status.innerHTML = '<span style="color:green;">✅ Product added!</span>';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-image').value = '';
            loadProducts();
        } else {
            status.innerHTML = '<span style="color:red;">❌ ' + data.message + '</span>';
        }
    }).catch(() => status.innerHTML = '<span style="color:red;">Failed</span>');
}

function deleteProduct(id) {
    if (!confirm('Delete this product?')) return;
    fetch('/api/products/' + id, { method: 'DELETE' })
    .then(r => r.json()).then(data => {
        if (data.success) loadProducts();
        else alert(data.message);
    });
}

function unsoldProduct(id) {
    if (!confirm('Mark this product as available?')) return;
    fetch('/api/products/' + id + '/unsold', { method: 'PUT' })
    .then(r => r.json()).then(data => {
        if (data.success) loadProducts();
        else alert(data.message);
    });
}

function loadPayments() {
    fetch('/pending-payments').then(r => r.json()).then(data => {
        const tbody = document.getElementById('payments-body');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No payments yet</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(p => `
            <tr>
                <td>${new Date(p.created_at).toLocaleDateString()}</td>
                <td>${p.user_name}</td>
                <td>${p.email}</td>
                <td>$${p.amount}</td>
                <td>${(JSON.parse(p.items || '[]')).map(i => i.name).join(', ')}</td>
                <td class="${p.status === 'confirmed_manual' ? 'confirmed' : 'pending'}">${p.status === 'confirmed_manual' ? '✅ Confirmed' : p.status === 'pending_manual' ? '⏳ Pending (M-Pesa)' : '✅ Paid'}</td>
                <td>${p.status === 'pending_manual' ? `<button class="confirm-btn" onclick="confirmPayment('${p.tx_ref}')">Confirm Paid</button>` : '-'}</td>
            </tr>
        `).join('');
    });
}

function confirmPayment(txRef) {
    if (!confirm('Mark this payment as confirmed?')) return;
    fetch('/confirm-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ txRef })
    }).then(r => r.json()).then(data => {
        alert(data.message);
        if (data.success) loadPayments();
    });
}

loadProducts();
loadPayments();
</script>
</body>
</html>
